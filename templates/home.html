{% extends 'layouts/base.html' %}
{% load mytags %}
{% block content %}
    <div class="row mt-4">
        {% for product in products %}
            {% check_cart request product.id as check %}
            <div class="col-3">
                <div class="card h-100" style="width: 18rem;">
                    <img src="{{ product.img.url }}" class="card-img-top" alt="..."
                         style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.price }}$</p>
                        <a href="{% url 'product:add_cart' id=product.id %}" class="btn btn-primary"><i
                                class="bi {% if check %}bi-cart-x-fill{% else %}bi-cart-check-fill{% endif %}"></i>
                            add to card</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
